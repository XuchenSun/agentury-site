<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgenturyAI - AI-Powered Job Search Assistant</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --muted: #555555;
            --border: #e0e0e0;
            --accent: #2563eb;
            --card-bg: #f9fafb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117;
                --text: #e8e8ed;
                --muted: #9ca3af;
                --border: #2a2d35;
                --accent: #60a5fa;
                --card-bg: #1a1d27;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { text-align: center; max-width: 600px; }
        .logo { font-size: 3rem; margin-bottom: 1rem; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; font-weight: 700; }
        .subtitle { color: var(--muted); font-size: 1.1rem; margin-bottom: 2.5rem; }
        .links { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
        a {
            color: var(--accent); text-decoration: none; font-size: 1rem;
            padding: 0.6rem 1.2rem; border: 1px solid var(--border);
            border-radius: 8px; transition: all 0.2s;
        }
        a:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖</div>
        <h1>AgenturyAI</h1>
        <p class="subtitle">AI-Powered Job Search Assistant</p>
        <div class="links">
            <a href="/privacy.html">Privacy Policy</a>
            <a href="/terms.html">Terms of Service</a>
        </div>
    </div>
</body>
</html>
